<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kniffel Scorecard & Stats</title>

  <meta name="theme-color" content="#f2f2f7">

  <style>
    :root {
      --bg-color: #f2f2f7;
      --card-bg: #ffffff;
      --accent-color: #ff9500; /* Apple Orange */
      --text-color: #000000;
      --text-secondary: #8e8e93;
      --border-color: #e5e5ea;
      --badge-bg: #e5e5ea;
      --danger-color: #ff3b30;
      --success-color: #34c759;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #000000;
        --card-bg: #1c1c1e;
        --text-color: #ffffff;
        --text-secondary: #8e8e93;
        --border-color: #2c2c2e;
        --badge-bg: #2c2c2e;
      }
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 19px;
      font-weight: 700;
      background-color: var(--bg-color);
      border-bottom: 1px solid var(--border-color);
      min-height: 52px;
    }

    header .header-title {
      flex: 1;
      text-align: center;
    }

    header .add-btn {
      background: none;
      border: none;
      color: var(--accent-color);
      font-size: 26px;
      font-weight: 400;
      cursor: pointer;
      padding: 0 4px;
      line-height: 1;
    }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      padding-bottom: 85px;
    }

    /* 5-Tab Navigation Bar */
    nav {
      display: flex;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 100;
      transition: transform 0.25s ease-in-out;
    }

    nav.hidden {
      transform: translateY(100%);
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: none;
      color: var(--text-secondary);
      font-size: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      gap: 3px;
    }

    .tab-btn svg {
      width: 26px;
      height: 26px;
      fill: currentColor;
    }

    .tab-btn.active {
      color: var(--accent-color);
      font-weight: 600;
    }

    /* Cards & Layout */
    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 10px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
    }

    .row:last-child {
      border-bottom: none;
    }

    .badge {
      background-color: var(--badge-bg);
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .badge.striked { color: var(--danger-color); }
    .badge.active { color: var(--accent-color); }

    .btn {
      width: 100%;
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--text-secondary);
    }

    /* Matrix Table für 2-6 Spieler */
    .scorecard-matrix-wrapper {
      display: flex;
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
    }

    .sticky-labels-col {
      width: 130px;
      flex-shrink: 0;
      background: var(--card-bg);
      border-right: 2px solid var(--border-color);
      z-index: 10;
    }

    .sticky-cell {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      font-size: 13px;
      font-weight: 600;
      border-bottom: 1px solid var(--border-color);
    }

    .sticky-cell.header-cell {
      height: 52px;
      background: var(--bg-color);
      color: var(--text-secondary);
      font-size: 11px;
      text-transform: uppercase;
    }

    .scrollable-players-col {
      display: flex;
      overflow-x: auto;
      flex-grow: 1;
      scroll-snap-type: x mandatory;
    }

    .player-col {
      min-width: calc(50% - 1px);
      flex: 0 0 calc(50% - 1px);
      border-right: 1px solid var(--border-color);
      scroll-snap-align: start;
    }

    .player-cell {
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
    }

    .player-cell.header-cell {
      height: 52px;
      background: var(--bg-color);
      font-weight: bold;
      font-size: 14px;
      color: var(--accent-color);
      flex-direction: column;
      padding: 4px;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    /* Modal / Bottom Sheets */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: flex-end;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--card-bg);
      width: 100%;
      border-radius: 16px 16px 0 0;
      padding: 24px;
      transform: translateY(100%);
      transition: transform 0.25s ease;
      padding-bottom: calc(24px + env(safe-area-inset-bottom));
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-overlay.active .modal {
      transform: translateY(0);
    }

    .grid-6 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .grid-btn {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 16px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      color: var(--text-color);
      cursor: pointer;
    }

    select, input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--bg-color);
      color: var(--text-color);
      font-size: 16px;
    }

    .stat-metric {
      font-size: 24px;
      font-weight: bold;
      color: var(--accent-color);
    }
